%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/mxic,uefc-channel.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Macronix UEFC Channel

maintainers:
  - Toto <toto@gmail.com>

description: |
  UEFC's channel description.

properties:
  "#address-cells":
    const: 1
  "#size-cells":
    const: 0

  reg:
    description: channel ID
    enum: [0, 1]

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: rx
      - const: tx

  mxic,parrallel-mode:
    description: The device is connected to both channels (A & B)
    type: boolean

patternProperties:
  "^.*@[0-9a-fA-F]+$":
    type: object
    description: Memory device nodes

    properties:
      memory-region:
        description:
          Memory region to be used for memory-map read access.

required:
  - '#address-cells'
  - '#size-cells'
  - reg
  - clocks
  - clock-names

additionalProperties: true
