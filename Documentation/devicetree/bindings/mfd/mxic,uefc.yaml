%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/mxic,uefc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Macronix UEFC (Unified Extensible Flash Controller)

maintainers:
  - Cheng Ming Lin <chengminglin@mxic.com.tw>

description: |
  The Macronix Unified Extensible Flash Controller (UEFC) is a multi-protocol
  flash host controller. It is exposed as an MFD whose child devices implement
  the per-channel protocols (xSPI, raw NAND or eMMC), all sharing the host
  controller register block and a pair of channels (A and B).

properties:
  compatible:
    enum:
      - mxic,uefc

  reg:
    minItems: 1
    items:
      - description: Host controller register block
      - description:
          Direct-mapped window the flash contents are accessed through,
          bypassing the register interface.

  reg-names:
    minItems: 1
    items:
      - const: regs
      - const: dirmap

  interrupts:
    maxItems: 2

  interrupt-names:
    items:
      - const: error
      - const: status

  reset-gpios:
    maxItems: 1
    description: GPIO connected the active-low reset

  clocks:
    items:
      - description: Clock domain 1, the system side of the TX/RX FIFO.
      - description:
          Clock domain 2, the device side of the TX/RX FIFO. The serial clock
          driven to the memory devices is derived from this one.
      - description:
          Output logic of the channel A interface. Must be synchronous with
          the device side clock and an integer multiple of its rate.
      - description:
          Input logic of the channel A interface. Must be synchronous with the
          device side clock and an integer multiple of its rate.
      - description: Output logic of the channel B interface, as for channel A.
      - description: Input logic of the channel B interface, as for channel A.

  clock-names:
    items:
      - const: sys
      - const: ss
      - const: tx_a
      - const: rx_a
      - const: tx_b
      - const: rx_b

  "#address-cells":
    enum: [0, 1]

  "#size-cells":
    const: 0

patternProperties:
  "^nand-controller":
    type: object
    $ref: /schemas/mtd/mxic,uefc-nand.yaml#

  "^mmc":
    type: object
    $ref: /schemas/mmc/mxic,uefc-mmc.yaml#

  "^spi":
    type: object
    $ref: /schemas/spi/mxic,uefc-xspi.yaml#

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |

    amba {
      #address-cells = <1>;
      #size-cells = <1>;

      uefc: uefc@43a00000 {
        compatible = "mxic,uefc";
        reg = <0x43a00000 0x1000>, <0x60000000 0x4000000>;
        reg-names = "regs", "dirmap";
        clocks = <&clk_sys>, <&clk_ss>,
                 <&clk_if>, <&clk_if>, <&clk_if>, <&clk_if>;
        clock-names = "sys", "ss", "tx_a", "rx_a", "tx_b", "rx_b";
        #address-cells = <1>;
        #size-cells = <0>;

        nand-controller@0 {
          compatible = "mxic,uefc-nand";
          #address-cells = <1>;
          #size-cells = <0>;
          reg = <0>;
        };

        spi@1 {
          compatible = "mxic,uefc-xspi";
          #address-cells = <1>;
          #size-cells = <0>;
          reg = <1>;
        };
      };
    };
...
