%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/mxic,uefc-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Macronix UEFC eMMC Controller

maintainers:
  - Todo <todo@gmail.com>

allOf:
  - $ref: mmc-controller.yaml

properties:
  compatible:
    enum:
      - mxic,uefc-mmc

  dmas:
    description: DMA channel for DMA slave mode

  reg:
    description: UEFC channel used
    enum: [0, 1]

  vcc-gpios:
    description: Optional GPIO controlling the card power (VCC) supply
    maxItems: 1

  vccq-gpios:
    description: Optional GPIO controlling the card I/O (VCCQ) supply
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |

    amba {
      #address-cells = <1>;
      #size-cells = <1>;

      uefc: uefc@43a00000 {
        compatible = "mxic,uefc";
        reg = <0x43a00000 0x1000>;
        clocks = <&clk_sys>, <&clk_ss>, <&clk_ss>, <&clk_ss>, <&clk_ss>, <&clk_ss>;
        clock-names = "sys", "ss", "tx_a", "rx_a", "tx_b", "rx_b";
        #address-cells = <1>;
        #size-cells = <0>;

        mmc@0 {
          compatible = "mxic,uefc-mmc";
          reg = <0>;
        };
      };
    };
...
