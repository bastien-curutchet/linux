%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/mxic,uefc-nand.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Macronix UEFC NAND controller

maintainers:
  - Cheng Ming Lin <linchengming884@gmail.com>

description: |
  The NAND sub-node of the Macronix UEFC drives a raw NAND channel of the host
  controller. See mxic,uefc.yaml for the parent device.

allOf:
  - $ref: nand-controller.yaml

properties:
  compatible:
    enum:
      - mxic,uefc-nand

  dmas:
    description: DMA channel for DMA slave mode

  reg:
    description: UEFC channel used
    enum: [0, 1]

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |

    amba {
      #address-cells = <1>;
      #size-cells = <1>;

      uefc: uefc@43a00000 {
        compatible = "mxic,uefc";
        reg = <0x43a00000 0x1000>;
        clocks = <&clk_sys>, <&clk_ss>, <&clk_ss>, <&clk_ss>, <&clk_ss>, <&clk_ss>;
        clock-names = "sys", "ss", "tx_a", "rx_a", "tx_b", "rx_b";
        #address-cells = <1>;
        #size-cells = <0>;

        nand-controller@1 {
          compatible = "mxic,uefc-nand";
          #address-cells = <1>;
          #size-cells = <0>;
          reg = <1>;
        };
      };
    };
...
