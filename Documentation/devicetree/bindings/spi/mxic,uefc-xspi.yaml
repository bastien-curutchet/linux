%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/mxic,uefc-xspi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Macronix UEFC xSPI interface

maintainers:
  - Cheng Ming Lin <linchengming884@gmail.com>

description: |
  The xSPI sub-node of the Macronix UEFC drives a SPI/OctaSPI memory channel of
  the host controller. See mxic,uefc.yaml for the parent device.

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    enum:
      - mxic,uefc-xspi

  dmas:
    description: DMA channel for DMA slave mode

  reg:
    description: UEFC channel used
    enum: [0, 1]

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    amba {
      #address-cells = <1>;
      #size-cells = <1>;

      uefc0: uefc@43a00000 {
        compatible = "mxic,uefc";
        reg = <0x43a00000 0x1000>;
        clocks = <&clk_sys>, <&clk_ss>, <&clk_ss>, <&clk_ss>, <&clk_ss>, <&clk_ss>;
        clock-names = "sys", "ss", "tx_a", "rx_a", "tx_b", "rx_b";
        #address-cells = <1>;
        #size-cells = <0>;

        spi@0 {
          compatible = "mxic,uefc-xspi";
          #address-cells = <1>;
          #size-cells = <0>;
          reg = <0>;

          flash@0 {
            compatible = "jedec,spi-nor";
            reg = <0x0>, <0x1>;
            parallel-memories = /bits/ 64  <0x1000000 0x1000000>; /* 16MB */
          };
        };
      };

      uefc1: uefc@43b00000 {
        compatible = "mxic,uefc";
        reg = <0x43b00000 0x1000>;
        clocks = <&clk_sys>, <&clk_ss>, <&clk_ss>, <&clk_ss>, <&clk_ss>, <&clk_ss>;
        clock-names = "sys", "ss", "tx_a", "rx_a", "tx_b", "rx_b";
        #address-cells = <1>;
        #size-cells = <0>;

        spi@0 {
          compatible = "mxic,uefc-xspi";
          #address-cells = <1>;
          #size-cells = <0>;
          reg = <0>;

          flash@0 {
            compatible = "jedec,spi-nor";
            reg = <0>;
          };
        };

        spi@1 {
          compatible = "mxic,uefc-xspi";
          #address-cells = <1>;
          #size-cells = <0>;
          reg = <0>;

          flash@0 {
            compatible = "jedec,spi-nor";
            reg = <0>;
          };
        };
      };
    };
...
